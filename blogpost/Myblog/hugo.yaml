baseURL: https://yourusername.github.io/your-blog-repo/
languageCode: en-us
title: Manish Mawatwal's Blog
theme: "PaperMod"
paginate: 10
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
outputs:
  home:
    - HTML
    - JSON

params:
  env: production
  description: "A blog about AI, .NET and technology"
  author: Your Name
  defaultTheme: auto
  
  homeInfoParams:
    Title: "Welcome to My Blog"
    Content: "Exploring AI, .NET, and modern technology"
  
  socialIcons:
    - name: github
      url: "https://github.com/manishmawat"
    - name: linkedin
      url: "https://linkedin.com/in/manishmawatwal"

menu:
  main:
    - name: Home
      url: /
      weight: 1
    - name: Posts
      url: /posts/
      weight: 10
    - name: Categories
      url: /categories/
      weight: 20
    - name: Tags
      url: /tags/
      weight: 30
    - name: Search
      url: /search/
      weight: 40

